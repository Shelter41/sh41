name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q -m 'not docker and not live'
      - run: python -m build
      - run: python -m venv /tmp/sh41-wheel
      - run: /tmp/sh41-wheel/bin/pip install dist/*.whl
      - run: /tmp/sh41-wheel/bin/sh41 --help
        working-directory: /tmp
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SH41_TEST_DOCKER: '1'
      SH41_TEST_BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -m 'docker and not live'
